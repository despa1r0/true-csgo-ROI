name: Build and push Docker Image 

on: 
  push:
    branches: 
      - main


env: 
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs: 
  build-and-push: 
    runs-on: ubuntu-latest

    permissions: 
      contents: read
      packages: write

    steps: 
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with: 
          context: . 
          push: true
          tags: | 
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 

  deploy: 
    needs: build-and-push  
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v6

      - name: Configure SSH
        env: 
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: | 
          mkdir -p ~/.ssh 
          echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_PORT" >> ~/.ssh/known_hosts
      - name: Copy prod compose file
        env: 
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          scp -P "$VPS_PORT" docker-compose.prod.yml \
            "$VPS_USER@$VPS_HOST:/opt/true-roi/docker-compose.prod.yml"
      - name: Deploy to vps 
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          IMAGE_TAG: ${{ github.sha }}
        run: | 
            ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            cd /opt/true-roi &&
            IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml pull &&
            IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml up -d
          "
