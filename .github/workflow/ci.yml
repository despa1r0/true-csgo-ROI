name: CI 

on: 
  pull_request:
    branches: 
      - main
  

  push: 
    branches: 
      - develop


jobs: 
  tests: 
    runs-on: ubuntu-latest
  
  steps: 
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v5
      with: 
        python-version: "3.13"
      
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requiremets.txt

    - name: Run tests 
      run: |
        pytest tests -v
        
  docker-build: 
  runs-on: ubuntu-latest

  steps: 
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Build Docker image
      run: |
        docker build -t true-roi:test .

