name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: CI/CD configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment script
        run: |
          bash -n scripts/deploy-production.sh
          shellcheck scripts/deploy-production.sh

      - name: Validate production Compose file
        env:
          IMAGE_TAG: 0000000000000000000000000000000000000000
          POSTGRES_DB: true_roi_ci
          POSTGRES_USER: true_roi_ci
          POSTGRES_PASSWORD: ci-only-placeholder
          CATALOG_SOURCE_URL: https://example.invalid/skins.json
          CATALOG_GROUPED_SOURCE_URL: https://example.invalid/skins-grouped.json
          CATALOG_EXTRA_SOURCE_BASE_URL: https://example.invalid
          SURFSHARK_WIREGUARD_PRIVATE_KEY: ci-only-placeholder
          SURFSHARK_WIREGUARD_ADDRESSES: 10.0.0.2/32
        run: docker compose -f docker-compose.prod.yml config --quiet

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest tests -q

  frontend-tests:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker build (${{ matrix.name }})
    needs: [quality-checks, backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: application
            dockerfile: Dockerfile
            cache-scope: true-roi-application
          - name: csmoney-worker
            dockerfile: Dockerfile.csmoney
            cache-scope: true-roi-csmoney
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}
