name: Build and deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

concurrency:
  group: true-roi-production
  cancel-in-progress: false

jobs:
  build-images:
    name: Publish Docker image (${{ matrix.dockerfile }})
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            image: despa1r0/true-csgo-roi
            cache-scope: true-roi-application
          - dockerfile: Dockerfile.csmoney
            image: despa1r0/true-csgo-roi-csmoney
            cache-scope: true-roi-csmoney
    steps:
      - name: Checkout image commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_TAG }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish SHA and latest tags
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

  deploy:
    name: Deploy SHA-pinned images to production
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_DIRECTORY: ${{ github.workspace }}/.deploy-ssh
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_TAG }}
          persist-credentials: false

      - name: Validate deployment inputs and configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: bash scripts/deploy/deploy-ssh.sh configure

      - name: Stage production Compose and deployment script
        run: bash scripts/deploy/deploy-ssh.sh copy

      - name: Run production deployment
        run: bash scripts/deploy/deploy-ssh.sh deploy

      - name: Remove SSH credentials
        if: always()
        run: bash scripts/deploy/deploy-ssh.sh cleanup
