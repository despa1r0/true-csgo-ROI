services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - true_roi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  catalog-seed:
    image: ghcr.io/despa1r0/true-csgo-roi:${IMAGE_TAG}
    command: ["python", "-m", "backend.app.seed_catalog"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CATALOG_SOURCE_URL: ${CATALOG_SOURCE_URL}
      CATALOG_GROUPED_SOURCE_URL: ${CATALOG_GROUPED_SOURCE_URL}
      CATALOG_EXTRA_SOURCE_BASE_URL: ${CATALOG_EXTRA_SOURCE_BASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/despa1r0/true-csgo-roi:${IMAGE_TAG}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CSFLOAT_API_KEY: ${CSFLOAT_API_KEY:-}
      CSFLOAT_CACHE_TTL_SECONDS: ${CSFLOAT_CACHE_TTL_SECONDS:-300}
      CSFLOAT_DETAILS_TTL_SECONDS: ${CSFLOAT_DETAILS_TTL_SECONDS:-600}
      WHITEMARKET_CACHE_TTL_SECONDS: ${WHITEMARKET_CACHE_TTL_SECONDS:-300}
      WHITEMARKET_PARTNER_TOKEN: ${WHITEMARKET_PARTNER_TOKEN:-}
      CSGOMARKET_API_KEY: ${CSGOMARKET_API_KEY:-}
      CSGOMARKET_MAX_REQUESTS_PER_SECOND: ${CSGOMARKET_MAX_REQUESTS_PER_SECOND:-0.5}
      CSGOMARKET_CACHE_TTL_SECONDS: ${CSGOMARKET_CACHE_TTL_SECONDS:-300}
      CSGOMARKET_DETAILS_TTL_SECONDS: ${CSGOMARKET_DETAILS_TTL_SECONDS:-600}
      CSGOMARKET_HISTORY_INDEX_TTL_SECONDS: ${CSGOMARKET_HISTORY_INDEX_TTL_SECONDS:-3600}
    ports:
      - "8005:8000"
    depends_on:
      catalog-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

volumes:
  true_roi_postgres:
