services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-true_roi}
      POSTGRES_USER: ${POSTGRES_USER:-true_roi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yourpassword}
    volumes:
      - true_roi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-true_roi} -d ${POSTGRES_DB:-true_roi}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  catalog-seed:
    build: .
    command: ["python", "-m", "backend.app.seed_catalog"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-true_roi}:${POSTGRES_PASSWORD:-yourpassword}@db:5432/${POSTGRES_DB:-true_roi}
      CATALOG_SOURCE_URL: https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/skins_not_grouped.json
      CATALOG_GROUPED_SOURCE_URL: https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/skins.json
      CATALOG_EXTRA_SOURCE_BASE_URL: https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-true_roi}:${POSTGRES_PASSWORD:-yourpassword}@db:5432/${POSTGRES_DB:-true_roi}
      CSFLOAT_API_KEY: ${CSFLOAT_API_KEY:-}
      CSFLOAT_CACHE_TTL_SECONDS: ${CSFLOAT_CACHE_TTL_SECONDS:-300}
      CSFLOAT_DETAILS_TTL_SECONDS: ${CSFLOAT_DETAILS_TTL_SECONDS:-600}
      WHITEMARKET_CACHE_TTL_SECONDS: ${WHITEMARKET_CACHE_TTL_SECONDS:-300}
      WHITEMARKET_PARTNER_TOKEN: ${WHITEMARKET_PARTNER_TOKEN:-}
      CSGOMARKET_API_KEY: ${CSGOMARKET_API_KEY:-}
      CSGOMARKET_MAX_REQUESTS_PER_SECOND: ${CSGOMARKET_MAX_REQUESTS_PER_SECOND:-0.5}
      CSGOMARKET_CACHE_TTL_SECONDS: ${CSGOMARKET_CACHE_TTL_SECONDS:-300}
      CSGOMARKET_DETAILS_TTL_SECONDS: ${CSGOMARKET_DETAILS_TTL_SECONDS:-600}
      CSGOMARKET_HISTORY_INDEX_TTL_SECONDS: ${CSGOMARKET_HISTORY_INDEX_TTL_SECONDS:-3600}
      CSMONEY_CACHE_TTL_SECONDS: ${CSMONEY_CACHE_TTL_SECONDS:-1800}
    ports:
      - "8005:8000"
    depends_on:
      catalog-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  csmoney-worker:
    build:
      context: .
      dockerfile: Dockerfile.csmoney
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-true_roi}:${POSTGRES_PASSWORD:-yourpassword}@db:5432/${POSTGRES_DB:-true_roi}
      CSGOMARKET_API_KEY: ${CSGOMARKET_API_KEY:-}
      CSGOMARKET_MAX_REQUESTS_PER_SECOND: ${CSGOMARKET_MAX_REQUESTS_PER_SECOND:-0.5}
      CSMONEY_CACHE_TTL_SECONDS: ${CSMONEY_CACHE_TTL_SECONDS:-1800}
      CSMONEY_CRAWL_TTL_SECONDS: ${CSMONEY_CRAWL_TTL_SECONDS:-86400}
      CSMONEY_MIN_REQUEST_INTERVAL_SECONDS: ${CSMONEY_MIN_REQUEST_INTERVAL_SECONDS:-10}
      CSMONEY_STOREFRONT_RETRY_SECONDS: ${CSMONEY_STOREFRONT_RETRY_SECONDS:-21600}
      CSMONEY_SCHEDULE_INTERVAL_SECONDS: ${CSMONEY_SCHEDULE_INTERVAL_SECONDS:-300}
    depends_on:
      catalog-seed:
        condition: service_completed_successfully
    restart: unless-stopped

  csmoney-demand:
    build: .
    command: ["python", "-m", "backend.app.csmoney_demand_worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-true_roi}:${POSTGRES_PASSWORD:-yourpassword}@db:5432/${POSTGRES_DB:-true_roi}
      CSGOMARKET_HISTORY_INDEX_TTL_SECONDS: ${CSGOMARKET_HISTORY_INDEX_TTL_SECONDS:-3600}
      CSMONEY_SCHEDULE_INTERVAL_SECONDS: ${CSMONEY_SCHEDULE_INTERVAL_SECONDS:-300}
    depends_on:
      catalog-seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  true_roi_postgres:
